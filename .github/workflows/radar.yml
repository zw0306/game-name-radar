name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US
      SEO_VERIFY_LIMIT: 5
      SEO_EXPAND_LIMIT: 0
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPER_VERIFY_LIMIT: 800
      SERPER_ONLINE_LIMIT: 560
      SERPER_WIKI_LIMIT: 240
      SERPER_TOTAL_LIMIT: 2450
      SERPER_DAILY_LIMIT: 2450
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY || secrets.GOOGLE_CSE_API_KEY_1 || secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX || secrets.GOOGLE_CSE_ID || secrets.GOOGLE_SEARCH_CX }}
      GOOGLE_CSE_API_KEY_2: ${{ secrets.GOOGLE_CSE_API_KEY_2 || secrets.GOOGLE_SEARCH_API_KEY_2 }}
      GOOGLE_CSE_CX_2: ${{ secrets.GOOGLE_CSE_CX_2 || secrets.GOOGLE_CSE_ID_2 || secrets.GOOGLE_SEARCH_CX_2 || secrets.GOOGLE_CSE_CX || secrets.GOOGLE_CSE_ID || secrets.GOOGLE_SEARCH_CX }}
      GOOGLE_CSE_VERIFY_LIMIT: 180
      GOOGLE_CSE_DAILY_LIMIT: 90
      TRENDS_VERIFY_LIMIT: 1
      TRENDS_ANCHOR: itch io
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
      SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
      SERPAPI_API_KEY_4: ${{ secrets.SERPAPI_API_KEY_4 }}
      SERPAPI_API_KEY_5: ${{ secrets.SERPAPI_API_KEY_5 }}
      SERPAPI_MONTHLY_LIMIT: 245
      SERPAPI_DAILY_LIMIT: 245
      SERPAPI_FILL_ENABLED: true
      SERPAPI_ONLINE_LIMIT: 999
      SERPAPI_WIKI_LIMIT: 999
      SERPAPI_FLEX_LIMIT: 999
      YOUTUBE_VERIFY_LIMIT: 3
      YOUTUBE_REGION: US
      YOUTUBE_LANGUAGE: en
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund
      - name: Run parser and scoring tests
        continue-on-error: true
        run: npm test
      - name: Reset legacy free Trends results
        run: node scripts/reset-legacy-trends.mjs
      - name: Discover games and build source evidence
        run: npm run scan
      - name: Classify online and wiki channels before verification
        run: npm run classify
      - name: Rush-verify up to 800 SEO candidates with Serper
        run: node scripts/verify-serper.mjs
      - name: Verify remaining SEO intent with Google CSE fallback
        run: node scripts/verify-google-cse.mjs
      - name: Recalculate typed site classification
        run: npm run classify
      - name: Spend all available pooled SerpApi quota immediately
        run: node scripts/fill-serpapi-pool.mjs
      - name: Finalize online and wiki opportunity counts
        run: npm run classify
      - name: Restore pooled SerpApi usage report
        run: node scripts/fill-serpapi-pool.mjs --report-only
      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: rush-verify fresh game opportunities"
          git push

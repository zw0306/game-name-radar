name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US

      # Disable direct/free Google verification paths.
      SEO_VERIFY_LIMIT: 0
      SEO_EXPAND_LIMIT: 0
      TRENDS_VERIFY_LIMIT: 0
      YOUTUBE_VERIFY_LIMIT: 0

      # Third-party Google Search provider: Serper.dev.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPER_VERIFY_LIMIT: 800
      SERPER_ONLINE_LIMIT: 560
      SERPER_WIKI_LIMIT: 240
      SERPER_TOTAL_LIMIT: 2450
      SERPER_DAILY_LIMIT: 2450

      # Primary third-party Google Trends provider: SerpApi.
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_MONTHLY_LIMIT: 245
      SERPAPI_DAILY_LIMIT: 245
      SERPAPI_FILL_ENABLED: true
      SERPAPI_ONLINE_LIMIT: 999
      SERPAPI_WIKI_LIMIT: 999
      SERPAPI_FLEX_LIMIT: 999

      # Pause production Apify queue while inspecting the latest alternative Actor run.
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APIFY_DATA_OPS_TRENDS_ACTOR_ID: data_ops_main~google-trends
      APIFY_FAST_TRENDS_ACTOR_ID: data_xplorer~google-trends-fast-scraper
      APIFY_TRENDS_ENABLED: true
      APIFY_TRENDS_VERIFY_LIMIT: 0
      APIFY_TRENDS_ONLINE_LIMIT: 0
      APIFY_TRENDS_WIKI_LIMIT: 0
      APIFY_TRENDS_CONCURRENCY: 1
      APIFY_TRENDS_TIMEOUT_MS: 150000
      APIFY_TRENDS_MONTHLY_CALL_LIMIT: 4000
      APIFY_TRENDS_MAX_CHARGE_USD: 0.05

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Apify account token without running an Actor
        run: node scripts/check-apify-account.mjs

      - name: Inspect latest resilient Apify Trends run without starting an Actor
        env:
          APIFY_TRENDS_ACTOR_ID: data_ops_main~google-trends
        run: node scripts/inspect-apify-trends-runs.mjs

      - name: Persist Apify fallback preflight diagnostics
        run: node scripts/check-apify-fallback-runtime.mjs

      - name: Run parser and scoring tests
        continue-on-error: true
        run: npm test

      - name: Reset legacy free Trends results
        run: node scripts/reset-legacy-trends.mjs

      - name: Discover games and build source evidence
        run: npm run scan

      - name: Classify online and wiki channels before verification
        run: npm run classify

      - name: Verify fresh SEO candidates with Serper
        run: node scripts/verify-serper.mjs

      - name: Recalculate typed site classification
        run: npm run classify

      - name: Inspect all SerpApi account quotas without spending searches
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
          SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
          SERPAPI_API_KEY_4: ${{ secrets.SERPAPI_API_KEY_4 }}
          SERPAPI_API_KEY_5: ${{ secrets.SERPAPI_API_KEY_5 }}
        run: node scripts/check-serpapi-accounts.mjs

      - name: Verify eligible Trends candidates with primary SerpApi account
        run: node scripts/fill-serpapi-pool.mjs

      - name: Restore SerpApi usage report
        run: node scripts/fill-serpapi-pool.mjs --report-only

      - name: Skip production Apify queue during Actor inspection
        id: apify_fill
        continue-on-error: true
        run: node scripts/fill-apify-trends.mjs

      - name: Record Apify fallback step outcome
        env:
          APIFY_STEP_OUTCOME: ${{ steps.apify_fill.outcome }}
          APIFY_STEP_CONCLUSION: ${{ steps.apify_fill.conclusion }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('data/apify-fallback-step.json',JSON.stringify({recordedAt:new Date().toISOString(),outcome:process.env.APIFY_STEP_OUTCOME,conclusion:process.env.APIFY_STEP_CONCLUSION},null,2)+'\n')"

      - name: Finalize online and wiki opportunity counts
        run: npm run classify

      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: inspect resilient Apify Trends actor"
          git push

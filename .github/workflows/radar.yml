name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/scanner.mjs"
      - "lib/seo-verifier.mjs"
      - "lib/fast-signals.mjs"
      - "lib/trend-verifier.mjs"
      - "lib/rising-discovery.mjs"
      - "lib/steam-discovery.mjs"
      - "scripts/scan.mjs"
      - "tests/**"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US
      TRENDS_VERIFY_LIMIT: 3
      TRENDS_ANCHOR: itch io
      YOUTUBE_VERIFY_LIMIT: 3
      YOUTUBE_REGION: US
      YOUTUBE_LANGUAGE: en
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund
      - name: Run parser and scoring tests
        continue-on-error: true
        run: npm test
      - name: Discover games and verify rising demand
        run: npm run scan
      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: update multi-source rising game results"
          git push

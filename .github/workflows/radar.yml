name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US

      # Disable direct/free Google verification paths.
      SEO_VERIFY_LIMIT: 0
      SEO_EXPAND_LIMIT: 0
      TRENDS_VERIFY_LIMIT: 0
      YOUTUBE_VERIFY_LIMIT: 0

      # Third-party Google Search provider: Serper.dev.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPER_VERIFY_LIMIT: 800
      SERPER_ONLINE_LIMIT: 560
      SERPER_WIKI_LIMIT: 240
      SERPER_TOTAL_LIMIT: 2450
      SERPER_DAILY_LIMIT: 2450

      # Third-party Google Trends provider: SerpApi.
      # Only the primary account is used for searches until account ownership and quotas are inspected.
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_MONTHLY_LIMIT: 245
      SERPAPI_DAILY_LIMIT: 245
      SERPAPI_FILL_ENABLED: true
      SERPAPI_ONLINE_LIMIT: 999
      SERPAPI_WIKI_LIMIT: 999
      SERPAPI_FLEX_LIMIT: 999

      # Apify fallback provider.
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APIFY_TRENDS_ACTOR_ID: apify~google-trends-scraper

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Apify account token without running an Actor
        run: node scripts/check-apify-account.mjs

      - name: Inspect Apify Google Trends output once
        run: node scripts/smoke-test-apify-trends.mjs

      - name: Run parser and scoring tests
        continue-on-error: true
        run: npm test

      - name: Reset legacy free Trends results
        run: node scripts/reset-legacy-trends.mjs

      - name: Discover games and build source evidence
        run: npm run scan

      - name: Classify online and wiki channels before verification
        run: npm run classify

      - name: Verify fresh SEO candidates with Serper
        run: node scripts/verify-serper.mjs

      - name: Recalculate typed site classification
        run: npm run classify

      - name: Inspect all SerpApi account quotas without spending searches
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
          SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
          SERPAPI_API_KEY_4: ${{ secrets.SERPAPI_API_KEY_4 }}
          SERPAPI_API_KEY_5: ${{ secrets.SERPAPI_API_KEY_5 }}
        run: node scripts/check-serpapi-accounts.mjs

      - name: Verify all eligible Trends candidates with primary SerpApi account
        run: node scripts/fill-serpapi-pool.mjs

      - name: Finalize online and wiki opportunity counts
        run: npm run classify

      - name: Restore SerpApi usage report
        run: node scripts/fill-serpapi-pool.mjs --report-only

      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: inspect Apify Trends output and verify game opportunities"
          git push

name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan sources
        run: npm run scan
      - name: Commit updated radar data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: update game radar data"
          git push

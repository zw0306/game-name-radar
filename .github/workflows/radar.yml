name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US
      SEO_VERIFY_LIMIT: 50
      SEO_EXPAND_LIMIT: 30
      TRENDS_VERIFY_LIMIT: 3
      TRENDS_ANCHOR: itch io
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_MONTHLY_LIMIT: 220
      SERPAPI_DAILY_LIMIT: 8
      SERPAPI_FILL_ENABLED: true
      SERPAPI_TIER1_LIMIT: 3
      SERPAPI_TIER2_LIMIT: 3
      SERPAPI_TIER3_LIMIT: 2
      YOUTUBE_VERIFY_LIMIT: 3
      YOUTUBE_REGION: US
      YOUTUBE_LANGUAGE: en
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund
      - name: Run parser and scoring tests
        continue-on-error: true
        run: npm test
      - name: Reset legacy free Trends results
        run: node scripts/reset-legacy-trends.mjs
      - name: Discover games and verify rising demand
        run: npm run scan
      - name: Expand low-risk SEO candidate verification
        run: node scripts/expand-seo-queue.mjs
      - name: Spend spare SerpApi quota on tiered candidates
        run: node scripts/fill-serpapi-quota.mjs
      - name: Classify online and wiki opportunities
        run: npm run classify
      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: update expanded SerpApi game opportunities"
          git push
